[project]
name = "family-multi-search-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp==1.27.1",
  "playwright>=1.50,<2",
  "starlette>=1.0,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
